<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Sara Zaleta</title>
<meta name="description" content="Get in touch with Sara Zaleta about piano and singing lessons, piano tuning, or booking Le Band.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="site-name" href="index.html">Sara <em>Zaleta</em></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav class="primary-nav" id="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <h2>Let's get in touch</h2>
    <p>Tell me a bit about what you're after — lessons, a tuning appointment, or booking Le Band — and I'll get back to you.</p>

    <!--
      Replace YOUR_FORM_ID below with the endpoint Formspree gives you
      after you create a form at https://formspree.io.
      Example: https://formspree.io/f/x… becomes the action URL as-is.
    -->
    <form class="contact-form" action="https://formspree.io/f/mjygrvaj" method="POST">
      <div class="field-row">
        <div class="field">
          <label for="first-name">First name <span class="req">*</span></label>
          <input type="text" id="first-name" name="First name" required>
        </div>
        <div class="field">
          <label for="last-name">Last name <span class="req">*</span></label>
          <input type="text" id="last-name" name="Last name" required>
        </div>
      </div>

      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="interest">You are interested in <span class="req">*</span></label>
        <select id="interest" name="Interested in" required>
          <option value="" disabled selected>Choose one</option>
          <option value="Piano and singing lessons">Piano and singing lessons</option>
          <option value="Piano tuning">Piano tuning</option>
          <option value="Le band">Le band</option>
        </select>
      </div>

      <div class="field">
        <label for="comment">Comment <span class="req">*</span></label>
        <textarea id="comment" name="Comment" required></textarea>
      </div>

      <!-- Optional: send people to a "thank you" page instead of Formspree's default one -->
      <!-- <input type="hidden" name="_next" value="https://www.sarazaleta.com/thanks.html"> -->

      <button class="submit-btn" type="submit">Submit</button>
      <p class="form-note">* Indicates required field</p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <p>Sara Zaleta · Hillsborough, NC · <a href="index.html">Home</a></p>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
